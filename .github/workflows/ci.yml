name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build
      - name: Migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/GridPrice.Api --no-build

  test-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly-Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiOnly-Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      # Throwaway password for the CI-only container above; not a secret.
      GRIDPRICE_SQLSERVER: Server=localhost,1433;User Id=sa;Password=CiOnly-Passw0rd!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test against SQL Server (fails if those tests were skipped)
        run: |
          dotnet test -- --report-xunit-trx --results-directory "$PWD/trx"
          if grep -q 'outcome="NotExecuted"' trx/*.trx; then echo "SQL Server tests were skipped"; exit 1; fi
